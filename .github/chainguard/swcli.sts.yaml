issuer: https://token.actions.githubusercontent.com
# Repositories created after 2026-07-15 carry immutable OIDC subjects with the
# numeric org and repo IDs: repo:shopwell-shop@329940059/shopwell-cli@1402631189:<context>.
# The ID groups stay optional so repositories without them keep matching.
subject_pattern: "repo:shopwell-shop(@329940059)?/shopwell-cli(@1402631189)?:(pull_request|ref:refs/heads/main)"
claim_pattern:
  workflow_ref: "shopwell-shop/shopwell-cli/\\.github/workflows/pr-docs-check\\.lock\\.yml@refs/heads/main"

permissions:
  contents: read
  issues: write
  pull_requests: write
