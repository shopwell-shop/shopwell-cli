name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-caller
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        # Keep publishing cache performance; changes to cache policy are deferred.
        # jactionlint ignore=cache-poisoning
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27'
          cache: true
          check-latest: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-version-feed:
    name: Publish version feed
    needs: release
    # Releases made with GITHUB_TOKEN never trigger workflows, so call it here
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/schema-pages.yml
